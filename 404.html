<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>404 page</title>


    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link
        href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Poppins:wght@400;500;600;700&display=swap"
        rel="stylesheet">

    <style>
        :root {
            --neon-cyan: #00f3ff;
            --neon-purple: #b500ff;
            --neon-red: #ff3366;
            --bg-dark: #050507;
            --text-main: #ffffff;
            --text-muted: #888899;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
        }


        .cyber-grid {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image:
                linear-gradient(rgba(255, 51, 102, 0.05) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 51, 102, 0.05) 1px, transparent 1px);
            background-size: 40px 40px;
            z-index: 0;
            transform: perspective(500px) rotateX(60deg) translateY(-100px) translateZ(-200px);
            animation: gridMove 10s linear infinite;
        }

        @keyframes gridMove {
            0% {
                transform: perspective(500px) rotateX(60deg) translateY(0) translateZ(-200px);
            }

            100% {
                transform: perspective(500px) rotateX(60deg) translateY(50px) translateZ(-200px);
            }
        }


        .floating {
            position: absolute;
            color: rgba(255, 51, 102, 0.1);
            font-size: 80px;
            animation: floatIcon 8s ease-in-out infinite;
            z-index: 1;
        }

        .float-1 {
            top: 15%;
            left: 15%;
            font-size: 100px;
            animation-delay: 0s;
        }

        .float-2 {
            bottom: 20%;
            right: 10%;
            font-size: 70px;
            animation-delay: 2s;
            color: rgba(0, 243, 255, 0.1);
        }

        .float-3 {
            top: 20%;
            right: 20%;
            font-size: 50px;
            animation-delay: 4s;
            color: rgba(181, 0, 255, 0.1);
        }

        @keyframes floatIcon {

            0%,
            100% {
                transform: translateY(0) rotate(0deg);
            }

            50% {
                transform: translateY(-30px) rotate(15deg);
            }
        }


        .error-container {
            position: relative;
            z-index: 10;
            background: rgba(18, 18, 24, 0.8);
            border: 1px solid rgba(255, 51, 102, 0.3);
            border-top: 4px solid var(--neon-red);
            border-radius: 24px;
            padding: 60px 40px;
            text-align: center;
            max-width: 650px;
            width: 90%;
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.8), 0 0 40px rgba(255, 51, 102, 0.1);
            animation: cardDrop 0.8s cubic-bezier(0.25, 1, 0.5, 1);
        }

        @keyframes cardDrop {
            from {
                opacity: 0;
                transform: translateY(-50px) scale(0.95);
            }

            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }


        .glitch-wrapper {
            position: relative;
            margin-bottom: 20px;
        }

        .glitch {
            font-family: 'Orbitron', sans-serif;
            font-size: 120px;
            font-weight: 900;
            line-height: 1;
            color: var(--text-main);
            text-shadow: 0 0 20px rgba(255, 51, 102, 0.8);
            position: relative;
            display: inline-block;
        }

        .glitch::before,
        .glitch::after {
            content: attr(data-text);
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(18, 18, 24, 0);
        }

        .glitch::before {
            left: 4px;
            text-shadow: -2px 0 var(--neon-cyan);
            clip: rect(44px, 450px, 56px, 0);
            animation: glitch-anim 5s infinite linear alternate-reverse;
        }

        .glitch::after {
            left: -4px;
            text-shadow: -2px 0 var(--neon-purple);
            clip: rect(44px, 450px, 56px, 0);
            animation: glitch-anim2 5s infinite linear alternate-reverse;
        }

        @keyframes glitch-anim {
            0% {
                clip: rect(12px, 9999px, 88px, 0);
            }

            5% {
                clip: rect(65px, 9999px, 23px, 0);
            }

            10% {
                clip: rect(120px, 9999px, 50px, 0);
            }

            15% {
                clip: rect(10px, 9999px, 90px, 0);
            }

            20% {
                clip: rect(45px, 9999px, 40px, 0);
            }

            25% {
                clip: rect(80px, 9999px, 15px, 0);
            }

            30% {
                clip: rect(30px, 9999px, 60px, 0);
            }

            100% {
                clip: rect(30px, 9999px, 60px, 0);
            }
        }

        @keyframes glitch-anim2 {
            0% {
                clip: rect(85px, 9999px, 12px, 0);
            }

            5% {
                clip: rect(20px, 9999px, 75px, 0);
            }

            10% {
                clip: rect(60px, 9999px, 30px, 0);
            }

            15% {
                clip: rect(95px, 9999px, 10px, 0);
            }

            20% {
                clip: rect(15px, 9999px, 85px, 0);
            }

            25% {
                clip: rect(50px, 9999px, 45px, 0);
            }

            30% {
                clip: rect(70px, 9999px, 20px, 0);
            }

            100% {
                clip: rect(70px, 9999px, 20px, 0);
            }
        }


        .error-title {
            font-family: 'Orbitron', sans-serif;
            font-size: 26px;
            color: var(--neon-red);
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
        }

        .error-desc {
            font-size: 15px;
            color: var(--text-muted);
            line-height: 1.8;
            margin-bottom: 40px;
            padding: 0 10px;
        }


        .btn-container {
            display: flex;
            justify-content: center;
            gap: 20px;
            flex-wrap: wrap;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            height: 50px;
            padding: 0 30px;
            font-size: 14px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
            text-decoration: none;
        }


        .btn-primary {
            background: var(--neon-cyan);
            color: #000;
            border: 2px solid var(--neon-cyan);
            box-shadow: 0 0 15px rgba(0, 243, 255, 0.3);
        }

        .btn-primary:hover {
            background: transparent;
            color: var(--neon-cyan);
            box-shadow: 0 0 25px rgba(0, 243, 255, 0.6);
            transform: translateY(-3px);
        }


        .btn-secondary {
            background: transparent;
            color: var(--text-main);
            border: 2px solid rgba(255, 255, 255, 0.2);
        }

        .btn-secondary:hover {
            border-color: var(--neon-purple);
            color: var(--neon-purple);
            box-shadow: 0 0 20px rgba(181, 0, 255, 0.4);
            transform: translateY(-3px);
            background: rgba(181, 0, 255, 0.05);
        }


        @media (max-width: 576px) {
            .error-container {
                padding: 40px 20px;
                border-radius: 20px;
            }

            .glitch {
                font-size: 80px;
            }

            .error-title {
                font-size: 18px;
                flex-direction: column;
                gap: 8px;
                text-align: center;
            }

            .error-desc {
                font-size: 13px;
                margin-bottom: 30px;
            }

            .btn-container {
                flex-direction: column;
                width: 100%;
                gap: 15px;
            }

            .btn {
                width: 100%;
                height: 55px;
            }

            .floating {
                display: none;
            }
        }
    </style>
</head>

<body>


    <div class="cyber-grid"></div>
    <div class="floating float-1"><i class="fa-solid fa-bug"></i></div>
    <div class="floating float-2"><i class="fa-solid fa-ghost"></i></div>
    <div class="floating float-3"><i class="fa-solid fa-skull"></i></div>


    <div class="error-container">

        <div class="glitch-wrapper">

            <div class="glitch" data-text="404">404</div>
        </div>

        <h2 class="error-title">
            <i class="fa-solid fa-triangle-exclamation"></i> System Failure
        </h2>

        <p class="error-desc">
            The neural link to the requested page has been severed. The data you are looking for does not exist in this
            sector or has been corrupted.
        </p>

        <div class="btn-container">

            <button onclick="goBack()" class="btn btn-secondary">
                <i class="fa-solid fa-clock-rotate-left"></i> Go Back
            </button>


            <a href="index.html" class="btn btn-primary">
                <i class="fa-solid fa-house"></i> Return to Base
            </a>
        </div>

    </div>


    <script>

        function goBack() {

            if (window.history.length > 1) {
                window.history.back();
            } else {

                window.location.href = "index.html";
            }
        }
    </script>

</body>

</html>
